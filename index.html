<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Product Listing Generator</title>

    <!-- external css -->
     <link rel="stylesheet" href="mystyle.css">

</head>
<body>
    
    <!-- body section -->
     <main id="body-section">

        <div class="container">
            <h1 class="product-heading">Product Catalogue</h1>

            <!-- product essential CTE's -->
            <div class="product-buttons">
                <button class="add-product">Add Product</button>
                <button class="remove-products">Remove All Products</button>
                <button class="reset-product">Reset</button>
            </div>

            <!-- products container -->
             <div class="product-container">
                
             </div>

        </div>

     </main>

    <!-- external js -->
     <script src="app.js"></script>

</body>
</html>
